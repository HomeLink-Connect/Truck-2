.boot{display:flex;align-items:center;justify-content:center;height:100%}

@keyframes pulse{50%{transform:scale(1.04)}}.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.sg div{background:var(--b6);border-radius:14px;padding:12px}.sg b{display:block;font-size:18px}.sg span{font-size:11.5px;color:var(--mut);font-weight:600}
@media(max-width:900px){.trk{grid-template-columns:1fr;height:auto}.trk #map{height:55vh}.trk .lst{max-height:360px}.trk .lst{order:2}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, startAfter, serverTimestamp, writeBatch, getCountFromServer, onSnapshot, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ CONFIG (public by design; protect with authorised domains + key restrictions) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCgTv9zCdz0eTQSgv5hUlqQ0QxaApI6jsQ",
  authDomain: "truck-project-261bf.firebaseapp.com",
  projectId: "truck-project-261bf",
  storageBucket: "truck-project-261bf.firebasestorage.app",
  messagingSenderId: "399205379833",
  appId: "1:399205379833:web:610783782711f6ffa03c28"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}

/* ============ HELPERS ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtD = d => d ? new Date(d + (String(d).length === 10 ? 'T00:00' : '')).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtTs = t => t && t.toDate ? t.toDate().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const num = v => v === '' || v == null ? null : Number(v);
function toast(msg, type = 'ok') { const t = document.createElement('div'); t.className = 'toast ' + type; t.innerHTML = `<i class="fa-solid ${type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${esc(msg)}</span>`; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4800); }
function modal(html, wide) { closeModal(); const m = document.createElement('div'); m.className = 'ov'; m.innerHTML = `<div class="mdl ${wide ? 'wide' : ''}" role="dialog">${html}</div>`; m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); }); $('#modalRoot').appendChild(m); return m; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function ask(title, text, okText = 'Confirm', danger) { return new Promise(res => { const m = modal(`<h2><i class="fa-solid fa-triangle-exclamation" style="color:var(--warn)"></i>${esc(title)}</h2><p style="color:var(--mut);line-height:1.5">${esc(text)}</p><div class="mf"><button class="btn ghost" data-n>Cancel</button><button class="btn ${danger ? 'red' : ''}" data-y>${esc(okText)}</button></div>`); m.querySelector('[data-y]').onclick = () => { closeModal(); res(true); }; m.querySelector('[data-n]').onclick = () => { closeModal(); res(false); }; }); }
const AUTH_ERR = { 'auth/invalid-credential': 'Wrong email or password.', 'auth/invalid-email': 'That email address is not valid.', 'auth/user-disabled': 'This account has been disabled.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes or reset your password.', 'auth/email-already-in-use': 'An account with this email already exists.', 'auth/weak-password': 'Password must be at least 8 characters.', 'auth/operation-not-allowed': 'Email/password sign-in is not switched on in Firebase Authentication.', 'auth/network-request-failed': 'No internet connection. Check your network and try again.' };
const errMsg = e => AUTH_ERR[e && e.code] || (e && e.code === 'permission-denied' ? 'You do not have permission to do that.' : (e && e.message) || 'Something went wrong.');
const field = (icon, label, name, val = '', type = 'text', extra = '') => `<div class="f ${extra.includes('full') ? 'full' : ''}"><i class="fa-solid fa-${icon}"></i><div><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra.replace('full', '')}></div></div>`;
const selectF = (icon, label, name, opts, val = '', extra = '') => `<div class="f ${extra}"><i class="fa-solid fa-${icon}"></i><div><label>${label}</label><select name="${name}">${opts.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div></div>`;

/* ============ ROLES & PERMISSIONS (mirrored in firestore.rules) ============ */
const ROLES = ['SUPER_ADMIN', 'OWNER', 'FLEET_MANAGER', 'OPERATIONS_MANAGER', 'DISPATCHER', 'FINANCE_MANAGER', 'MAINTENANCE_MANAGER', 'DRIVER', 'VIEWER'];
const roleLabel = r => String(r || '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const ADMIN = ['SUPER_ADMIN', 'OWNER'], FLEET_W = [...ADMIN, 'FLEET_MANAGER', 'OPERATIONS_MANAGER'];
const PERM = { dashboard: { view: ROLES.filter(r => r !== 'DRIVER') }, fleet: { view: ROLES.filter(r => r !== 'DRIVER'), write: FLEET_W, del: [...ADMIN, 'FLEET_MANAGER'], status: [...FLEET_W, 'DISPATCHER'] }, staff: { view: ADMIN, write: ADMIN }, audit: { view: ADMIN }, roadmap: { view: ROLES.filter(r => r !== 'DRIVER') }, tracking: { view: ROLES.filter(r => r !== 'DRIVER') }, driver: { view: ['DRIVER'] }, drivers: { view: FLEET_W, write: FLEET_W, del: ADMIN }, health: { view: ADMIN } };
const S = { user: null, profile: null, company: { name: 'Your Company' }, route: 'dashboard' };
const can = (m, a) => !!(PERM[m] && PERM[m][a] && S.profile && PERM[m][a].includes(S.profile.role));

/* ============ AUDIT ============ */
async function audit(action, entity, entityId, changes = {}) {
  try { await addDoc(collection(db, 'auditLogs'), { userId: S.user.uid, userName: S.profile.name, userEmail: S.user.email, role: S.profile.role, action, entity, entityId: entityId || '', changes, ts: serverTimestamp() }); }
  catch (e) { console.warn('audit failed', e); toast('Action saved, but the audit entry could not be written.', 'err'); }
}
const diffObj = (o, n) => { const d = {}; for (const k of new Set([...Object.keys(o || {}), ...Object.keys(n || {})])) { if (['updatedAt', 'updatedBy', 'createdAt', 'createdBy'].includes(k)) continue; if (JSON.stringify(o?.[k] ?? null) !== JSON.stringify(n?.[k] ?? null)) d[k] = { from: o?.[k] ?? null, to: n?.[k] ?? null }; } return d; };

/* ============ AUTH SCREENS ============ */
const root = $('#app');
function authShell(inner) { return `<div class="auth"><div class="auth-hero"><div><div class="brand"><div class="logo"><i class="fa-solid fa-truck-fast"></i></div>FleetCommand</div><h1>Run your entire fleet from one command centre.</h1><p>Vehicles, drivers, trips and cross-border operations, with a full audit trail and role-based access.</p></div><div class="feat"><div><i class="fa-solid fa-shield-halved"></i>Role-based security and audit log</div><div><i class="fa-solid fa-truck"></i>Real fleet records, no fake data</div><div><i class="fa-solid fa-earth-africa"></i>Built for cross-border logistics</div></div></div><div class="auth-form"><div class="auth-box">${inner}</div></div></div>`; }
function showAuth(mode = 'login', msg = '', kind = 'err') {
  const m = msg ? `<div class="msg ${kind}">${esc(msg)}</div>` : '';
  const titles = { login: ['Welcome back', 'Sign in to your fleet workspace.'], register: ['Create owner account', 'The first account becomes the company owner.'], reset: ['Reset password', 'We will email you a reset link.'] };
  root.innerHTML = authShell(`<h2>${titles[mode][0]}</h2><p class="sub">${titles[mode][1]}</p>${m}<form id="af" novalidate>
    ${mode === 'register' ? field('user', 'Full name', 'name', '', 'text', 'autocomplete="name" required') : ''}
    ${field('envelope', 'Email', 'email', '', 'email', 'autocomplete="email" required')}

async function loadVehicles() {

function validateVehicle(d) {
  const e = []; const yr = new Date().getFullYear();
  if (!d.fleetId) e.push('Fleet ID is required.'); if (!d.registration) e.push('Registration number is required.'); else if (!/^[A-Za-z0-9 \-]{3,15}$/.test(d.registration)) e.push('Registration must be 3 to 15 letters, numbers, spaces or dashes.');
  if (!d.make) e.push('Make is required.'); if (!d.model) e.push('Model is required.');
  if (d.year != null && (!Number.isInteger(d.year) || d.year < 1980 || d.year > yr + 1)) e.push(`Year must be between 1980 and ${yr + 1}.`);
  if (d.vin && !/^[A-HJ-NPR-Z0-9]{17}$/i.test(d.vin)) e.push('VIN must be 17 characters (no I, O or Q).');
  for (const [k, l] of [['mileage', 'Mileage'], ['tankLitres', 'Tank capacity'], ['purchasePrice', 'Purchase price'], ['currentValue', 'Current value']]) if (d[k] != null && (isNaN(d[k]) || d[k] < 0)) e.push(`${l} must be a positive number.`);
  for (const [k, l] of [['insuranceExpiry', 'Insurance expiry'], ['roadLicenceExpiry', 'Road licence expiry'], ['cofExpiry', 'Fitness certificate expiry'], ['purchaseDate', 'Purchase date']]) if (d[k] && (!/^\d{4}-\d{2}-\d{2}$/.test(d[k]) || isNaN(new Date(d[k])))) e.push(`${l} is not a valid date.`);
  if (d.purchaseDate && d.purchaseDate > today()) e.push('Purchase date cannot be in the future.');
  return e;
}

  if (c.accuracy > 150) { TRK.msg = `Weak GPS signal (±${Math.round(c.accuracy)} m). Waiting for a better fix…`; return paintTrk(); }
  TRK.msg = ''; if (now - TRK.lastLive < 10000) return paintTrk(); TRK.lastLive = now;
  const spd = c.speed != null && !isNaN(c.speed) ? Math.round(c.speed * 36) / 10 : null, hd = c.heading != null && !isNaN(c.heading) ? Math.round(c.heading) : null, lat = c.latitude, lng = c.longitude;
  try {
    await setDoc(doc(db, 'gpsLive', v.id), { vehicleId: v.id, registration: v.registration, fleetId: v.fleetId || '', driverUid: S.user.uid, driverName: S.profile.name, lat, lng, speed: spd, heading: hd, accuracy: Math.round(c.accuracy), source: 'driver-phone', ts: serverTimestamp() }); TRK.sent = now;
    const h = TRK.lastHist; if (!h || distM(h, { lat, lng }) > 100 || now - h.t > 300000) { await addDoc(collection(db, 'gpsPositions'), { vehicleId: v.id, lat, lng, speed: spd, heading: hd, source: 'driver-phone', ts: serverTimestamp() }); TRK.lastHist = { lat, lng, t: now }; }
  } catch (e) { TRK.msg = 'Could not send location: ' + errMsg(e); }
  paintTrk();
}


/* ============ DRIVERS (full profiles + registration PIN) ============ */
const dcol = collection(db, 'drivers'), EMP = ['Active', 'On leave', 'Suspended', 'Terminated'], LCLASS = ['Class 1', 'Class 2', 'Class 3', 'Class 4', 'Other'];
const expBadge = d => { if (!d) return '<span class="badge s-gr">Not set</span>'; const t = today(), soon = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10); return d < t ? `<span class="badge s-bd">Expired ${fmtD(d)}</span>` : d <= soon ? `<span class="badge s-wn">Due ${fmtD(d)}</span>` : `<span class="badge s-ok">${fmtD(d)}</span>`; };
const newPin = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
const driverLink = () => new URL('fleet-driver.html', location.href).href;
async function viewDrivers() {
  const [ds, iv, vs] = await Promise.all([getDocs(query(dcol, orderBy('fullName'), limit(300))), getDocs(query(collection(db, 'driverInvites'), where('claimed', '==', false), limit(300))), getDocs(query(vcol, where('driverId', '!=', ''), limit(300)))]);
  const rows = ds.docs.map(d => ({ id: d.id, ...d.data() })), pending = new Set(iv.docs.map(d => d.id)), veh = {}; vs.forEach(d => { const x = d.data(); if (x.driverId) veh[x.driverId] = x.registration; });
  $('#view').innerHTML = `<div class="tools"><div class="f"><i class="fa-solid fa-magnifying-glass"></i><div><label>Search drivers</label><input id="dq" placeholder="name, employee ID, phone…"></div></div>${can('drivers', 'write') ? '<button class="btn" id="da"><i class="fa-solid fa-user-plus"></i>Register driver</button>' : ''}</div>
  <div class="card" style="padding:0"><div class="tw"><table class="rt"><thead><tr><th>Driver</th><th>Employee ID</th><th>Phone</th><th>Licence</th><th>Medical</th><th>Vehicle</th><th>Employment</th><th>App access</th><th></th></tr></thead><tbody id="db">${rows.length ? rows.map(d => `<tr><td data-l="Driver"><b>${esc(d.fullName)}</b><div style="color:var(--mut);font-size:12px">${esc(d.email)}</div></td><td data-l="Employee ID">${esc(d.employeeId)}</td><td data-l="Phone">${esc(d.phone)}</td><td data-l="Licence">${esc(d.licenceClass || '')} ${expBadge(d.licenceExpiry)}</td><td data-l="Medical">${expBadge(d.medicalExpiry)}</td><td data-l="Vehicle">${esc(veh[d.id] || '—')}</td><td data-l="Employment"><span class="badge ${d.employmentStatus === 'Active' ? 's-ok' : d.employmentStatus === 'On leave' ? 's-wn' : 's-bd'}">${esc(d.employmentStatus)}</span></td><td data-l="App access"><span class="badge ${pending.has(d.emailLower) ? 's-wn' : 's-ok'}">${pending.has(d.emailLower) ? 'Awaiting registration' : 'Registered'}</span></td><td><div class="act">${pending.has(d.emailLower) && can('drivers', 'write') ? `<button class="btn sm ghost" data-pin="${d.id}" title="Show / reset registration PIN"><i class="fa-solid fa-key"></i></button>` : ''}${can('drivers', 'write') ? `<button class="btn sm ghost" data-e="${d.id}" aria-label="Edit"><i class="fa-solid fa-pen"></i></button>` : ''}${can('drivers', 'del') ? `<button class="btn sm red" data-d="${d.id}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}</div></td></tr>`).join('') : `<tr><td colspan="9"><div class="empty"><i class="fa-solid fa-id-card"></i>No drivers registered yet.<br>Register a driver to give them access to the Driver app.</div></td></tr>`}</tbody></table></div></div>`;
  if ($('#da')) $('#da').onclick = () => driverForm();
  $('#dq').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#db tr').forEach(t => t.classList.toggle('hidden', !t.textContent.toLowerCase().includes(q))); };
  document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => driverForm(rows.find(r => r.id === b.dataset.e)));
  document.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => resetPin(rows.find(r => r.id === b.dataset.pin)));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => deleteDriver(rows.find(r => r.id === b.dataset.d)));
}
function pinModal(d, pin) {
  const msg = `Hello ${d.fullName}, you have been registered as a driver. Open ${driverLink()} then tap "New driver? Register here". Use your email ${d.email} and registration PIN ${pin}.`;
  const m = modal(`<h2><i class="fa-solid fa-key" style="color:var(--b3)"></i>Give the driver this PIN</h2><div class="msg ok" style="text-align:center"><div style="font-size:12px;font-weight:700">REGISTRATION PIN FOR ${esc(d.fullName.toUpperCase())}</div><div style="font-size:38px;font-weight:800;letter-spacing:.2em;margin:6px 0">${pin}</div></div><p style="color:var(--mut);line-height:1.6">The driver opens the Driver app, taps <b>New driver? Register here</b>, and enters <b>${esc(d.email)}</b>, this PIN and a password. The PIN works once.</p><div class="mf" style="justify-content:space-between;flex-wrap:wrap"><button class="btn ghost" id="pc"><i class="fa-regular fa-copy"></i>Copy message</button><a class="btn" style="text-decoration:none;background:#16A34A" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}"><i class="fa-brands fa-whatsapp"></i>Send on WhatsApp</a><button class="btn ghost" id="pd">Done</button></div>`);
  $('#pd').onclick = closeModal; $('#pc').onclick = async () => { try { await navigator.clipboard.writeText(msg); toast('Copied.'); } catch (e) { toast('Copy failed. Select and copy the PIN manually.', 'err'); } };
}
async function resetPin(d) { try { const pin = newPin(); await setDoc(doc(db, 'driverSecrets', d.emailLower), { pin, driverId: d.id, updatedAt: serverTimestamp() }); await audit('RESET_DRIVER_PIN', 'driver', d.id, { driver: { from: null, to: d.fullName } }); pinModal(d, pin); } catch (e) { toast(errMsg(e), 'err'); } }
async function deleteDriver(d) {
  if (!await ask('Delete driver?', `${d.fullName} will be removed and can no longer use the Driver app. This cannot be undone.`, 'Delete', true)) return;
  try {
    const b = writeBatch(db); b.delete(doc(db, 'drivers', d.id)); b.delete(doc(db, 'driverInvites', d.emailLower)); b.delete(doc(db, 'driverSecrets', d.emailLower));
    const vs = await getDocs(query(vcol, where('driverId', '==', d.id))); vs.forEach(v => b.update(v.ref, { driverId: '', driverName: '' })); await b.commit();
    const us = await getDocs(query(collection(db, 'users'), where('driverId', '==', d.id))); for (const u of us.docs) await updateDoc(u.ref, { active: false });
    await audit('DELETE_DRIVER', 'driver', d.id, { driver: { from: d.fullName, to: null } }); toast('Driver deleted and app access removed.'); viewDrivers();
  } catch (e) { toast(errMsg(e), 'err'); }
}
async function driverForm(d) {
  const vs = await getDocs(query(vcol, orderBy('fleetId'), limit(300))), vehicles = vs.docs.map(v => ({ id: v.id, ...v.data() })).filter(v => !v.driverId || (d && v.driverId === d.id)), cur = d ? (vehicles.find(v => v.driverId === d.id) || {}).id || '' : '';
  const x = d || { employmentStatus: 'Active', licenceClass: LCLASS[0] };
  modal(`<h2><i class="fa-solid fa-id-card" style="color:var(--b3)"></i>${d ? 'Edit driver' : 'Register driver'}</h2><div id="de"></div><form id="df" novalidate><div class="fg">
  ${field('user', 'Full name *', 'fullName', x.fullName)}${field('hashtag', 'Employee ID *', 'employeeId', x.employeeId)}${field('phone', 'Phone *', 'phone', x.phone, 'tel')}${field('envelope', 'Email * (used to log in)', 'email', x.email, 'email', d ? 'readonly' : '')}
  ${field('location-dot', 'Home address', 'address', x.address, 'text', 'full')}${field('address-card', 'National ID', 'nationalId', x.nationalId)}${field('passport', 'Passport number', 'passportNo', x.passportNo)}
  ${field('id-badge', 'Driver licence no. *', 'licenceNo', x.licenceNo)}${selectF('layer-group', 'Licence class', 'licenceClass', LCLASS, x.licenceClass)}${field('calendar-xmark', 'Licence expiry *', 'licenceExpiry', x.licenceExpiry, 'date')}${field('notes-medical', 'Medical certificate expiry', 'medicalExpiry', x.medicalExpiry, 'date')}
  ${field('user-shield', 'Emergency contact name', 'emergencyName', x.emergencyName)}${field('phone-volume', 'Emergency contact phone', 'emergencyPhone', x.emergencyPhone, 'tel')}${selectF('briefcase', 'Employment status', 'employmentStatus', EMP, x.employmentStatus)}
  <div class="f"><i class="fa-solid fa-truck"></i><div><label>Assigned vehicle</label><select name="vehicleId"><option value="">— None —</option>${vehicles.map(v => `<option value="${esc(v.id)}" ${v.id === cur ? 'selected' : ''}>${esc(v.registration)} (${esc(v.fleetId)})</option>`).join('')}</select></div></div>
  <div class="f full"><i class="fa-solid fa-note-sticky"></i><div><label>Notes</label><textarea name="notes">${esc(x.notes || '')}</textarea></div></div></div><div class="mf"><button type="button" class="btn ghost" id="dx">Cancel</button><button class="btn" id="ds"><i class="fa-solid fa-floppy-disk"></i>${d ? 'Save changes' : 'Register driver'}</button></div></form>`, true);
  $('#dx').onclick = closeModal;
  $('#df').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), g = k => (f.get(k) || '').toString().trim(), em = g('email').toLowerCase();
    const r = { fullName: g('fullName'), employeeId: g('employeeId'), phone: g('phone'), email: em, emailLower: em, address: g('address'), nationalId: g('nationalId'), passportNo: g('passportNo'), licenceNo: g('licenceNo'), licenceClass: g('licenceClass'), licenceExpiry: g('licenceExpiry'), medicalExpiry: g('medicalExpiry'), emergencyName: g('emergencyName'), emergencyPhone: g('emergencyPhone'), employmentStatus: g('employmentStatus'), notes: g('notes') }, er = [];
    if (r.fullName.length < 2) er.push('Full name is required.'); if (!r.employeeId) er.push('Employee ID is required.'); if (!/^[+0-9 ()-]{7,20}$/.test(r.phone)) er.push('Enter a valid phone number.'); if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) er.push('Enter a valid email address.'); if (!r.licenceNo) er.push('Licence number is required.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(r.licenceExpiry)) er.push('Licence expiry date is required.'); if (r.medicalExpiry && !/^\d{4}-\d{2}-\d{2}$/.test(r.medicalExpiry)) er.push('Medical expiry is not a valid date.'); if (r.emergencyPhone && !/^[+0-9 ()-]{7,20}$/.test(r.emergencyPhone)) er.push('Emergency phone is not valid.');
    if (er.length) { $('#de').innerHTML = `<div class="msg err">${er.map(esc).join('<br>')}</div>`; return; } $('#ds').disabled = true;
    try {
      for (const [k, l] of [['emailLower', 'email'], ['employeeId', 'employee ID']]) { const dup = await getDocs(query(dcol, where(k, '==', r[k]), limit(2))); if (dup.docs.some(z => z.id !== (d && d.id))) throw { message: `A driver with this ${l} already exists.` }; }
      const nv = g('vehicleId'), b = writeBatch(db); let id = d && d.id, pin = null;
      if (d) { b.update(doc(db, 'drivers', id), { ...r, updatedAt: serverTimestamp(), updatedBy: S.user.uid }); }
      else { const ref = doc(dcol); id = ref.id; pin = newPin(); b.set(ref, { ...r, createdAt: serverTimestamp(), createdBy: S.user.uid }); b.set(doc(db, 'driverInvites', em), { email: em, driverId: id, claimed: false, createdAt: serverTimestamp(), createdBy: S.user.uid }); b.set(doc(db, 'driverSecrets', em), { pin, driverId: id, createdAt: serverTimestamp() }); }
      if (nv !== cur) { if (cur) b.update(doc(db, 'vehicles', cur), { driverId: '', driverName: '', updatedAt: serverTimestamp(), updatedBy: S.user.uid }); if (nv) b.update(doc(db, 'vehicles', nv), { driverId: id, driverName: r.fullName, updatedAt: serverTimestamp(), updatedBy: S.user.uid }); }
      await b.commit();
      if (d) { const us = await getDocs(query(collection(db, 'users'), where('driverId', '==', id))); const on = r.employmentStatus === 'Active' || r.employmentStatus === 'On leave'; for (const u of us.docs) { try { await updateDoc(u.ref, { active: on, name: r.fullName, phone: r.phone }); } catch (e2) {} } }
      await audit(d ? 'UPDATE_DRIVER' : 'REGISTER_DRIVER', 'driver', id, d ? { ...diffObj(d, r), driver: r.fullName } : { driver: { from: null, to: r.fullName } });
      closeModal(); viewDrivers(); if (pin) pinModal({ ...r, id }, pin); else toast('Driver updated.');
    } catch (er2) { $('#de').innerHTML = `<div class="msg err">${esc(errMsg(er2))}</div>`; $('#ds').disabled = false; }
  };
}

/* ============ SYSTEM CHECK ============ */
async function viewHealth() {
  const T = [
    ['Internet connection', async () => { if (!navigator.onLine) throw { message: 'No connection.' }; }, 'Connect to the internet.'],
    ['Your email is verified', async () => { if (!S.user.emailVerified) throw { message: 'Not verified.' }; }, 'Open the verification link in your email.'],
    ['Read staff (users)', () => getDocs(query(collection(db, 'users'), limit(1))), 'Publish firestore.rules in Firebase → Firestore → Rules.'],
    ['Read vehicles', () => getDocs(query(vcol, limit(1))), 'Publish firestore.rules.'],
    ['Read drivers', () => getDocs(query(dcol, limit(1))), 'Publish the latest firestore.rules.'],
    ['Read driver registrations', () => getDocs(query(collection(db, 'driverInvites'), limit(1))), 'Publish the latest firestore.rules.'],
    ['Read live GPS', () => getDocs(query(gcol, limit(1))), 'Publish the latest firestore.rules.'],
    ['Write audit log', () => audit('SYSTEM_CHECK', 'system', ''), 'Publish firestore.rules (auditLogs create rule).'],
    ['Route-history index', () => getDocs(query(collection(db, 'gpsPositions'), where('vehicleId', '==', '__check'), where('ts', '>=', Timestamp.fromMillis(0)), orderBy('ts'), limit(1))), 'Open the link shown in the error to create the index, wait 2 minutes, run again.'],
    ['Map library loaded', async () => { if (typeof L === 'undefined') throw { message: 'Leaflet did not load.' }; }, 'Check the internet connection and reload.'],
    ['Browser supports GPS', async () => { if (!('geolocation' in navigator)) throw { message: 'No GPS support.' }; }, 'Use Chrome or Safari on a phone.']
  ];
  $('#view').innerHTML = `<div class="card"><h3><i class="fa-solid fa-stethoscope" style="color:var(--b3)"></i>System check</h3><div id="hl">${T.map((t, i) => `<div style="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)" id="h${i}"><i class="fa-solid fa-circle-notch fa-spin" style="margin-top:3px;color:var(--mut)"></i><div><b>${t[0]}</b></div></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3><i class="fa-solid fa-list-check" style="color:var(--b3)"></i>One-time Firebase setup</h3><ol style="line-height:1.9;padding-left:20px;color:var(--mut)"><li>Authentication → Sign-in method → turn on <b>Email/Password</b>.</li><li>Authentication → Settings → Authorized domains → add the address you host this on.</li><li>Firestore Database → Rules → paste <b>firestore.rules</b> → Publish.</li><li>Upload <b>index.html</b> and <b>fleet-driver.html</b> to the same folder on your host.</li></ol></div>`;
  for (let i = 0; i < T.length; i++) { const el = $('#h' + i); try { await T[i][1](); el.innerHTML = `<i class="fa-solid fa-circle-check" style="margin-top:3px;color:var(--ok)"></i><div><b>${T[i][0]}</b></div>`; } catch (e) { el.innerHTML = `<i class="fa-solid fa-circle-xmark" style="margin-top:3px;color:var(--bad)"></i><div><b>${T[i][0]}</b><div style="color:var(--bad);font-size:12.5px;word-break:break-word">${esc((e && (e.message || e.code)) || 'Failed')}</div><div style="color:var(--mut);font-size:12.5px">Fix: ${T[i][2]}</div></div>`; } }
}

/* ============ ROADMAP ============ */
async function viewRoadmap() {
  const R = [['Authentication, email verification, roles, staff, audit log', 'Built', 's-ok'], ['Fleet management (vehicles, documents, status)', 'Built', 's-ok'], ['Driver registration and full driver profiles', 'Built', 's-ok'], ['Trailers, customers', 'Phase 2', 's-bl'], ['Trips, cargo, border events', 'Phase 2', 's-bl'], ['Fuel, maintenance, expenses, profitability', 'Phase 3', 's-bl'], ['Documents upload (ImageKit), reports, CSV and PDF', 'Phase 3', 's-bl'], ['Live GPS from driver phones + live map + route history', 'Built', 's-ok'], ['GPS hardware trackers (Worker), geofences, speed alerts', 'Phase 4', 's-wn'], ['Push, email and SMS alerts', 'Phase 4', 's-wn']];
  const X = [['GPS trackers or telematics API', 'Needed for live positions. No positions are shown until a real device reports.'], ['Cloudflare Worker (free)', 'Receives GPS data and sends alerts, since Cloud Functions are not used.'], ['ImageKit', 'Stores documents and receipts.'], ['Email / SMS provider', 'Only needed for alerts outside the app.']];
  $('#view').innerHTML = `<div class="grid two"><div class="card"><h3><i class="fa-solid fa-list-check" style="color:var(--b3)"></i>Development phases</h3>${R.map(r => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><span>${r[0]}</span><span class="badge ${r[2]}">${r[1]}</span></div>`).join('')}</div><div class="card"><h3><i class="fa-solid fa-plug" style="color:var(--b3)"></i>External services required</h3>${X.map(r => `<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${r[0]}</b><div style="color:var(--mut);margin-top:2px">${r[1]}</div></div>`).join('')}</div></div>`;
}
