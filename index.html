<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B3D91">
<title>FleetCommand Driver</title>
<script>
/* If another app's service worker controls this address, remove it once so FleetCommand loads itself. */
(function(){if(!('serviceWorker' in navigator))return;navigator.serviceWorker.getRegistrations().then(function(rs){var any=false;rs.forEach(function(r){if(location.href.indexOf(r.scope)===0){any=true;r.unregister();}});
if(any&&!sessionStorage.getItem('fc_sw_fix')){sessionStorage.setItem('fc_sw_fix','1');var go=function(){location.reload()};if(window.caches){caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}).then(go,go)}else go()}})})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--b1:#0B3D91;--b2:#1255C8;--b3:#1769E0;--b5:#DBEAFE;--b6:#EFF5FF;--tx:#0F1B33;--mut:#64748B;--line:#E3E9F4;--ok:#0E9F6E;--bad:#DC2626;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{background:#F3F6FC;color:var(--tx);font-size:15px}
.hero{background:linear-gradient(160deg,var(--b1),var(--b2) 65%,#2E7BF0);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 90px;border-radius:0 0 34px 34px}
.top{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--b2);display:flex;align-items:center;justify-content:center;font-size:19px}
.top b{display:block;font-size:16px}.top span{font-size:12px;opacity:.8}.top button{margin-left:auto;border:0;background:rgba(255,255,255,.16);color:#fff;width:42px;height:42px;border-radius:13px;font-size:16px}
.wrap{max-width:520px;margin:-66px auto 0;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 34px rgba(15,40,100,.12);padding:20px;margin-bottom:14px}
.veh{display:flex;gap:14px;align-items:center}.veh .ic{width:54px;height:54px;border-radius:17px;background:var(--b5);color:var(--b3);font-size:23px;display:flex;align-items:center;justify-content:center;flex:none}
.veh h2{font-size:22px;font-weight:800;letter-spacing:-.01em}.veh small{color:var(--mut);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--b5);color:var(--b1)}.pill.on{background:#DCFCE7;color:#166534}.pill.off{background:#EEF2F7;color:#475569}
.pill i{font-size:8px}
.go{width:190px;height:190px;border-radius:50%;border:0;color:#fff;font-weight:800;font-size:18px;background:linear-gradient(135deg,#1769E0,#0B3D91);box-shadow:0 18px 40px rgba(23,105,224,.5);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;margin:26px auto 14px;transition:transform .15s}
.go i{font-size:42px}.go:active{transform:scale(.96)}.go.on{background:linear-gradient(135deg,#EF4444,#991B1B);box-shadow:0 18px 40px rgba(220,38,38,.45);animation:pu 2s infinite}@keyframes pu{50%{transform:scale(1.04)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid div{background:var(--b6);border-radius:16px;padding:13px 8px;text-align:center}.grid b{display:block;font-size:19px;font-weight:800}.grid span{font-size:11px;color:var(--mut);font-weight:600}
.msg{padding:12px 14px;border-radius:14px;font-weight:600;font-size:13.5px;line-height:1.45;margin-top:12px}.msg.err{background:#FEE2E2;color:#991B1B}.msg.ok{background:#DCFCE7;color:#166534}.msg.info{background:var(--b5);color:var(--b1)}
.note{color:var(--mut);font-size:12.5px;line-height:1.6;text-align:center;margin-top:10px}
.f{display:flex;align-items:center;gap:11px;background:var(--b6);border:1.5px solid var(--line);border-radius:16px;padding:8px 13px 8px 10px;margin-bottom:12px}.f:focus-within{background:#fff;border-color:var(--b3);box-shadow:0 0 0 4px rgba(23,105,224,.12)}
.f>i{width:36px;height:36px;border-radius:11px;background:var(--b5);color:var(--b3);display:flex;align-items:center;justify-content:center;flex:none}.f>div{flex:1}.f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.f input{width:100%;border:0;background:none;outline:0;font:inherit;font-weight:600;padding:3px 0;font-size:16px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;color:#fff;background:var(--b3);display:flex;gap:9px;align-items:center;justify-content:center}.btn.ghost{background:var(--b5);color:var(--b2);margin-top:10px}.btn:disabled{opacity:.6}
.lnk{background:none;border:0;color:var(--b3);font:inherit;font-weight:700;padding:10px 0}
.spin{width:26px;height:26px;border:3px solid var(--b5);border-top-color:var(--b3);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}@keyframes s{to{transform:rotate(360deg)}}
.offline{background:#FEF3C7;color:#92400E;text-align:center;padding:8px;font-weight:700;font-size:13px}
.center{text-align:center}.center h2{font-size:22px;font-weight:800;margin:6px 0 8px}.center p{color:var(--mut);line-height:1.6}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="off" class="offline hidden"><i class="fa-solid fa-wifi"></i> No internet. Location will send again when you are back online.</div>
<div id="app"><div class="spin"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, where, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgTv9zCdz0eTQSgv5hUlqQ0QxaApI6jsQ",
  authDomain: "truck-project-261bf.firebaseapp.com",
  projectId: "truck-project-261bf",
  storageBucket: "truck-project-261bf.firebasestorage.app",
  messagingSenderId: "399205379833",
  appId: "1:399205379833:web:610783782711f6ffa03c28"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}

const $ = (s) => document.querySelector(s), root = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ERR = { 'auth/invalid-credential': 'Wrong email or password.', 'auth/invalid-email': 'That email is not valid.', 'auth/user-disabled': 'This account is disabled.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes or reset your password.', 'auth/email-already-in-use': 'This email already has an account. Please sign in instead.', 'auth/weak-password': 'Password must be at least 8 characters.', 'auth/operation-not-allowed': 'Email/password sign-in is not switched on in Firebase Authentication.', 'auth/network-request-failed': 'No internet connection.', 'permission-denied': 'You do not have permission to do that.' };
const errMsg = (e) => ERR[e && e.code] || (e && e.message) || 'Something went wrong.';
const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
const dist = (a, b) => { const r = Math.PI / 180, x = (b.lng - a.lng) * r * Math.cos((a.lat + b.lat) / 2 * r), y = (b.lat - a.lat) * r; return Math.sqrt(x * x + y * y) * 6371000; };
addEventListener('offline', () => $('#off').classList.remove('hidden')); addEventListener('online', () => $('#off').classList.add('hidden')); if (!navigator.onLine) $('#off').classList.remove('hidden');

const hero = (name, out) => `<div class="hero"><div class="top"><div class="logo"><i class="fa-solid fa-truck-fast"></i></div><div><b>FleetCommand</b><span>${esc(name || 'Driver')}</span></div>${out ? '<button id="lo" aria-label="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>' : ''}</div></div>`;

/* ---------- sign in ---------- */
function showLogin(msg, kind = 'err', reset) {
  root.innerHTML = hero() + `<div class="wrap"><div class="card"><h2 style="font-size:22px;font-weight:800">${reset ? 'Reset password' : 'Driver sign in'}</h2><p style="color:var(--mut);margin:4px 0 18px">${reset ? 'We will email you a reset link.' : 'Use the email your company registered for you.'}</p>${msg ? `<div class="msg ${kind}" style="margin:0 0 14px">${esc(msg)}</div>` : ''}
  <form id="lf"><div class="f"><i class="fa-solid fa-envelope"></i><div><label>Email</label><input name="e" type="email" autocomplete="email" required></div></div>${reset ? '' : '<div class="f"><i class="fa-solid fa-lock"></i><div><label>Password</label><input name="p" type="password" autocomplete="current-password" required></div></div>'}
  <button class="btn"><i class="fa-solid fa-${reset ? 'paper-plane' : 'right-to-bracket'}"></i>${reset ? 'Send reset link' : 'Sign in'}</button></form><div class="center"><button class="lnk" id="sw">${reset ? 'Back to sign in' : 'Forgot password?'}</button>${reset ? '' : '<br><button class="lnk" id="rg">New driver? Register here</button>'}</div></div></div>`;
  $('#sw').onclick = () => showLogin('', 'err', !reset); if ($('#rg')) $('#rg').onclick = () => showRegister();
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target), b = e.target.querySelector('button'); b.disabled = true;
    try { if (reset) { await sendPasswordResetEmail(auth, f.get('e').trim()); showLogin('If that email has an account, a link is on its way. Open it, set your password, then sign in.', 'ok'); } else await signInWithEmailAndPassword(auth, f.get('e').trim(), f.get('p')); }
    catch (er) { showLogin(errMsg(er), 'err', reset); }
  };
}
function showCenter(icon, title, text, extra = '') { root.innerHTML = hero('', true) + `<div class="wrap"><div class="card center"><div style="font-size:38px;color:var(--b3)"><i class="fa-solid fa-${icon}"></i></div><h2>${title}</h2><p>${text}</p>${extra}</div></div>`; $('#lo').onclick = () => signOut(auth); }
function showVerify(u) {
  showCenter('envelope-circle-check', 'Verify your email', `We sent a link to <b>${esc(u.email)}</b>. Open it, then tap the button below.`, '<button class="btn" id="vc" style="margin-top:16px">I have verified, continue</button><button class="btn ghost" id="vr">Resend email</button>');
  $('#vc').onclick = async () => { await u.reload(); await u.getIdToken(true); auth.currentUser.emailVerified ? start(auth.currentUser) : alert('Not verified yet. Check your inbox and spam folder.'); };
  $('#vr').onclick = async () => { try { await sendEmailVerification(u); alert('Verification email sent.'); } catch (e) { alert(errMsg(e)); } };
}


/* ---------- registration: only drivers the company registered, proved by the PIN ---------- */
const lc = (x) => String(x || '').trim().toLowerCase();
let REG = false, INV = null;
function showRegister(email = '', msg = '', kind = 'err', ok = false) {
  const blocked = msg.startsWith('Get registered first');
  root.innerHTML = hero() + `<div class="wrap"><div class="card"><h2 style="font-size:22px;font-weight:800">Driver registration</h2><p style="color:var(--mut);margin:4px 0 18px">Only drivers registered by their company can create an account.</p>
  ${blocked ? `<div class="msg err" style="margin:0 0 14px;text-align:center"><div style="font-size:30px"><i class="fa-solid fa-user-lock"></i></div><div style="font-size:18px;font-weight:800;margin:6px 0">Get registered first</div><div style="font-weight:500">This email is not on the company's driver list. Ask your fleet manager to register you in the management system, then come back with your PIN.</div></div>` : msg ? `<div class="msg ${kind}" style="margin:0 0 14px">${esc(msg)}</div>` : ''}
  ${!ok ? `<form id="ck"><div class="f"><i class="fa-solid fa-envelope"></i><div><label>Your email</label><input name="e" type="email" autocomplete="email" value="${esc(email)}" required></div></div><button class="btn"><i class="fa-solid fa-magnifying-glass"></i>Check my registration</button></form>`
  : `<div class="msg ok" style="margin:0 0 14px"><i class="fa-solid fa-circle-check"></i> ${esc(email)} is registered with your company.</div><form id="rf"><div class="f"><i class="fa-solid fa-key"></i><div><label>Registration PIN (6 digits)</label><input name="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></div></div><div class="f"><i class="fa-solid fa-user"></i><div><label>Full name</label><input name="n" autocomplete="name" required></div></div><div class="f"><i class="fa-solid fa-phone"></i><div><label>Phone</label><input name="ph" type="tel" autocomplete="tel"></div></div><div class="f"><i class="fa-solid fa-lock"></i><div><label>Create password (8+ characters)</label><input name="p" type="password" autocomplete="new-password" required></div></div><div class="f"><i class="fa-solid fa-lock"></i><div><label>Confirm password</label><input name="p2" type="password" autocomplete="new-password" required></div></div><button class="btn"><i class="fa-solid fa-user-plus"></i>Create my account</button></form>`}
  <div class="center"><button class="lnk" id="bk">Back to sign in</button></div></div></div>`;
  $('#bk').onclick = () => showLogin();
  if ($('#ck')) $('#ck').onsubmit = async (e) => {
    e.preventDefault(); const em = lc(new FormData(e.target).get('e')); e.target.querySelector('button').disabled = true;
    try { const sn = await getDoc(doc(db, 'driverInvites', em)); if (!sn.exists()) return showRegister(em, 'Get registered first'); if (sn.data().claimed) return showRegister(em, 'This email is already registered. Please sign in.', 'info'); INV = sn.data(); showRegister(em, '', 'ok', true); }
    catch (er) { showRegister(em, errMsg(er)); }
  };
  if ($('#rf')) $('#rf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target), n = f.get('n').trim(), p = f.get('p'), pin = f.get('pin').trim(), ph = f.get('ph').trim();
    if (!/^\d{6}$/.test(pin)) return showRegister(email, 'The PIN is 6 digits.', 'err', true); if (n.length < 2) return showRegister(email, 'Enter your full name.', 'err', true); if (p.length < 8) return showRegister(email, 'Password must be at least 8 characters.', 'err', true); if (p !== f.get('p2')) return showRegister(email, 'The two passwords do not match.', 'err', true);
    e.target.querySelector('button').disabled = true; REG = true; let cred;
    try { cred = await createUserWithEmailAndPassword(auth, email, p); }
    catch (er) { REG = false; return showRegister(email, errMsg(er), 'err', true); }
    try {
      await setDoc(doc(db, 'users', cred.user.uid), { name: n, email, phone: ph, role: 'DRIVER', active: true, driverId: INV.driverId, invitePin: pin, createdAt: serverTimestamp(), createdBy: INV.createdBy || '' });
      await updateDoc(doc(db, 'driverInvites', email), { claimed: true, claimedBy: cred.user.uid, claimedAt: serverTimestamp() });
    } catch (er) { try { await cred.user.delete(); } catch (x) { await signOut(auth); } REG = false; return showRegister(email, er.code === 'permission-denied' ? 'Wrong registration PIN, or the company rules are not published yet. Check the PIN with your fleet manager.' : errMsg(er), 'err', true); }
    REG = false; start(cred.user);
  };
}

/* ---------- boot ---------- */
let ME = null, VEH = null;
onAuthStateChanged(auth, (u) => { if (REG) return; if (!u) { stopTrack(true); ME = null; return showLogin(); } start(u); });
async function start(u) {
  root.innerHTML = '<div class="spin"></div>';
  try {
    const ps = await getDoc(doc(db, 'users', u.uid));
    if (!ps.exists()) { await signOut(auth); return showRegister(lc(u.email), 'Get registered first'); }
    ME = { id: u.uid, ...ps.data() };
    if (!ME.active) return showCenter('ban', 'Account deactivated', 'Contact your fleet manager.');
    if (ME.role !== 'DRIVER') return showCenter('desktop', 'This app is for drivers', 'You are signed in as ' + esc(ME.role.replace(/_/g, ' ').toLowerCase()) + '. Use the management system instead.', '<a class="btn" style="text-decoration:none;margin-top:16px" href="./">Open management system</a>');
    const sn = await getDocs(query(collection(db, 'vehicles'), where('driverId', '==', ME.driverId || '__none'), limit(1)));
    VEH = sn.docs[0] ? { id: sn.docs[0].id, ...sn.docs[0].data() } : null;
    if (!VEH) return showCenter('truck', 'No vehicle assigned', 'Ask your fleet manager to assign you to a vehicle, then reopen this page.');
    render(); if (sessionStorage.getItem('fc_on') === '1') startTrack();
  } catch (e) { if (e && e.code === 'permission-denied') return showCenter('desktop', 'This app is for drivers', 'This account is not a driver account. Use the management system instead.', '<a class="btn" style="text-decoration:none;margin-top:16px" href="./">Open management system</a><button class="btn ghost" id="so2">Sign out</button>') || ($('#so2').onclick = () => signOut(auth));
    showCenter('rotate', 'Could not load', esc(errMsg(e)) + '. Check your internet and try again.', '<button class="btn" style="margin-top:16px" onclick="location.reload()">Try again</button>'); }
}

/* ---------- tracker ---------- */
const T = { on: false, watch: null, wake: null, fix: null, sent: 0, lastLive: 0, hist: null, msg: '', count: 0 };
function render() {
  root.innerHTML = hero(ME.name, true) + `<div class="wrap"><div class="card"><div class="veh"><div class="ic"><i class="fa-solid fa-truck"></i></div><div style="flex:1;min-width:0"><small>${esc(VEH.fleetId || '')}</small><h2>${esc(VEH.registration)}</h2><small>${esc([VEH.make, VEH.model].filter(Boolean).join(' '))}</small></div></div></div>
  <div class="card center"><span class="pill" id="pl"></span><button class="go" id="go"></button><div id="tm"></div></div>
  <div class="card"><div class="grid"><div><b id="ta">—</b><span>GPS accuracy</span></div><div><b id="ts">—</b><span>Speed</span></div><div><b id="tc">0</b><span>Updates sent</span></div></div><div class="note" id="tl">Last sent: —</div></div>
  <p class="note">Keep this screen open and the phone unlocked while driving. Phones pause GPS when the screen is locked or this page is in the background. Use a car charger.<br>Tip: use your browser menu → <b>Add to Home screen</b> for quick access.</p></div>`;
  $('#lo').onclick = () => { stopTrack(); signOut(auth); }; $('#go').onclick = () => (T.on ? stopTrack() : startTrack()); paint();
}
function paint() {
  const g = $('#go'); if (!g) return; g.className = 'go' + (T.on ? ' on' : ''); g.innerHTML = T.on ? '<i class="fa-solid fa-stop"></i>Stop sharing' : '<i class="fa-solid fa-play"></i>Start trip';
  const p = $('#pl'); p.className = 'pill ' + (T.on ? 'on' : 'off'); p.innerHTML = `<i class="fa-solid fa-circle"></i>${T.on ? 'Sharing live location' : 'Not sharing'}`;
  $('#ta').textContent = T.fix ? '±' + Math.round(T.fix.acc) + ' m' : '—'; $('#ts').textContent = T.fix && T.fix.spd != null ? Math.round(T.fix.spd) + ' km/h' : '—'; $('#tc').textContent = T.count; $('#tl').textContent = 'Last sent: ' + (T.sent ? ago(T.sent) : '—');
  $('#tm').innerHTML = T.msg ? `<div class="msg err">${esc(T.msg)}</div>` : T.on ? '<div class="msg ok">The control room can see your position.</div>' : '<div class="msg info">Tap Start trip when you begin driving.</div>';
}
async function audit(action) { try { await addDoc(collection(db, 'auditLogs'), { userId: ME.id, userName: ME.name, userEmail: ME.email, role: ME.role, action, entity: 'vehicle', entityId: VEH.id, changes: { vehicle: { from: null, to: VEH.registration } }, ts: serverTimestamp() }); } catch (e) {} }
async function startTrack() {
  if (!('geolocation' in navigator)) { T.msg = 'This phone or browser does not support GPS.'; return paint(); }
  try { if ('wakeLock' in navigator) T.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  T.on = true; T.msg = ''; T.lastLive = 0; sessionStorage.setItem('fc_on', '1'); paint(); audit('TRACKING_START');
  T.watch = navigator.geolocation.watchPosition(onFix, (e) => { T.msg = { 1: 'Location is blocked. Allow location for this site in your browser settings, then tap Start trip again.', 2: 'No GPS signal. Move to open sky.', 3: 'GPS is slow. Still trying…' }[e.code] || 'GPS error.'; if (e.code === 1) stopTrack(true); paint(); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
}
function stopTrack(keep) {
  if (T.watch != null) navigator.geolocation.clearWatch(T.watch); T.watch = null; try { T.wake && T.wake.release(); } catch (e) {} T.wake = null;
  const was = T.on; T.on = false; sessionStorage.removeItem('fc_on'); if (!keep) T.msg = ''; if (was && ME && VEH) audit('TRACKING_STOP'); paint();
}
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && T.on && 'wakeLock' in navigator) { try { T.wake = await navigator.wakeLock.request('screen'); } catch (e) {} } });
async function onFix(p) {
  const c = p.coords, now = Date.now(); T.fix = { acc: c.accuracy, spd: c.speed != null ? c.speed * 3.6 : null };
  if (c.accuracy > 150) { T.msg = `Weak GPS (±${Math.round(c.accuracy)} m). Waiting for a better signal…`; return paint(); }
  T.msg = ''; if (now - T.lastLive < 10000) return paint(); T.lastLive = now;
  const spd = c.speed != null && !isNaN(c.speed) ? Math.round(c.speed * 36) / 10 : null, hd = c.heading != null && !isNaN(c.heading) ? Math.round(c.heading) : null, lat = c.latitude, lng = c.longitude;
  try {
    await setDoc(doc(db, 'gpsLive', VEH.id), { vehicleId: VEH.id, registration: VEH.registration, fleetId: VEH.fleetId || '', driverUid: ME.id, driverName: ME.name, lat, lng, speed: spd, heading: hd, accuracy: Math.round(c.accuracy), source: 'driver-phone', ts: serverTimestamp() });
    T.sent = now; T.count++;
    const h = T.hist; if (!h || dist(h, { lat, lng }) > 100 || now - h.t > 300000) { await addDoc(collection(db, 'gpsPositions'), { vehicleId: VEH.id, lat, lng, speed: spd, heading: hd, source: 'driver-phone', ts: serverTimestamp() }); T.hist = { lat, lng, t: now }; }
  } catch (e) { T.msg = 'Could not send location: ' + errMsg(e); }
  paint();
}
setInterval(() => { if (T.on) paint(); }, 20000);
</script>
</body>
</html>
